# Local prod-like stack: Postgres 16 + pgvector. The app image is added in Phase 9.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
      POSTGRES_DB: hr
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-ro-role.sql:/docker-entrypoint-initdb.d/10-ro-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
