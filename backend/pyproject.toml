[project]
name = "hr-assistant"
version = "0.1.0"
description = "HR assistant: policy RAG + guarded SQL agent with row-level access control"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-playwright>=0.5",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-requests",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency markers are designed to be called in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Cookie", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerates these; its column definitions routinely exceed the line length.
"app/db/migrations/versions/*.py" = ["E501"]
# The attacker case list is a data table of verbatim adversarial questions; wrapping the
# strings would obscure the exact inputs that were run.
"app/eval/attacker.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The unit/integration suite; E2E browser journeys live in tests/e2e and run separately
# (they need the app running + frontend built — see the TESTING guide).
testpaths = ["tests"]
norecursedirs = ["tests/e2e"]
